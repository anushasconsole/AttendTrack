<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendTrack — Site Manager Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06040f;--bg2:#0d0820;
  --purple:#6c2bd9;--purple-mid:#9b59f5;--purple-light:#c084fc;
  --violet:#7c3aed;--pink:#e879f9;--green:#4ade80;--red:#ef4444;
  --amber:#f59e0b;--blue:#3b82f6;
  --white:#f8f4ff;--white-dim:rgba(248,244,255,0.65);
  --white-faint:rgba(248,244,255,0.10);--glow:rgba(124,58,237,0.4);
  --border:rgba(156,84,245,0.22);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;min-height:100vh}
nav{position:fixed;top:0;width:100%;z-index:100;padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(24px);background:rgba(6,4,15,.85);border-bottom:1px solid var(--border)}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.15rem;background:linear-gradient(135deg,var(--purple-light),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-right{display:flex;align-items:center;gap:.7rem}
.nav-badge{font-size:.68rem;padding:.22rem .7rem;border-radius:100px;border:1px solid rgba(251,191,36,.4);color:var(--amber);text-transform:uppercase;letter-spacing:.05em}
.nav-name{font-size:.82rem;color:var(--white-dim)}
.btn-sm{background:var(--white-faint);border:1px solid var(--border);color:var(--white-dim);padding:.3rem .8rem;border-radius:100px;font-size:.73rem;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-sm:hover{border-color:var(--red);color:var(--red)}

/* login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;max-width:420px;width:100%;padding:2rem}
.card-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;text-align:center;margin-bottom:.25rem}
.card-sub{text-align:center;font-size:.75rem;color:var(--white-dim);margin-bottom:1.4rem;letter-spacing:.05em;text-transform:uppercase}
label{font-size:.7rem;color:var(--purple-light);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.28rem;display:block}
input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:.62rem .9rem;color:var(--white);font-family:'DM Sans',sans-serif;font-size:.88rem;outline:none;transition:border-color .25s;margin-bottom:.8rem}
input:focus,select:focus{border-color:var(--purple-light)}
select option{background:#1a0a3d}
.btn{width:100%;padding:.78rem;border-radius:100px;border:none;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .3s}
.btn-primary{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;box-shadow:0 0 30px var(--glow)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.demo-chips{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-bottom:1rem}
.chip{font-size:.67rem;padding:.2rem .6rem;border:1px solid var(--border);border-radius:100px;color:var(--white-dim);cursor:pointer;background:var(--white-faint)}
.chip:hover{border-color:var(--amber);color:var(--amber)}
.msg{font-size:.8rem;text-align:center;padding:.45rem;border-radius:8px;margin-top:.5rem;display:none}
.msg.err{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.3);display:block}

/* main layout */
#app{display:none;padding-top:4.5rem}
.main{max-width:1100px;margin:0 auto;padding:1.5rem}
.page-title{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:.3rem}
.page-title em{font-style:italic;background:linear-gradient(135deg,var(--purple-mid),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.page-sub{font-size:.82rem;color:var(--white-dim);margin-bottom:1.5rem}

/* stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.75rem;margin-bottom:1.5rem}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1rem;text-align:center}
.stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;line-height:1}
.stat-lbl{font-size:.7rem;color:var(--white-dim);margin-top:.3rem;letter-spacing:.04em}
.stat-val.green{color:var(--green)}
.stat-val.amber{color:var(--amber)}
.stat-val.blue{color:var(--blue)}

/* tabs */
.tabs{display:flex;gap:.4rem;margin-bottom:1.2rem;border-bottom:1px solid var(--border);padding-bottom:.5rem}
.tab{padding:.4rem .9rem;border-radius:100px;font-size:.8rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;border:1px solid transparent}
.tab.active{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;border-color:transparent}
.tab:not(.active){color:var(--white-dim);background:var(--white-faint);border-color:var(--border)}
.tab:not(.active):hover{border-color:var(--purple-light);color:var(--purple-light)}
.tab-badge{display:inline-block;background:var(--amber);color:#000;border-radius:100px;font-size:.6rem;padding:.1rem .35rem;margin-left:.3rem;font-weight:700}

/* records */
.rec-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:.65rem;transition:border-color .2s}
.rec-card:hover{border-color:var(--purple-light)}
.rec-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem}
.rec-name{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem}
.rec-meta{font-size:.75rem;color:var(--white-dim);margin-top:.1rem}
.badge{display:inline-block;font-size:.65rem;padding:.18rem .55rem;border-radius:100px;font-weight:600}
.b-active{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.3)}
.b-pending{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.b-approved{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.b-rejected{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.rec-times{font-size:.78rem;color:var(--white-dim);margin:.35rem 0}
.rec-actions{display:flex;gap:.5rem;margin-top:.6rem}
.rec-actions input{font-size:.78rem;padding:.4rem .7rem;margin:0;flex:1}
.btn-approve{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.4);border-radius:100px;padding:.38rem .9rem;font-size:.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-approve:hover{background:rgba(74,222,128,.3)}
.btn-reject{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.3);border-radius:100px;padding:.38rem .9rem;font-size:.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-reject:hover{background:rgba(239,68,68,.2)}
.empty{color:var(--white-dim);font-size:.82rem;text-align:center;padding:2rem 0;background:var(--bg2);border:1px solid var(--border);border-radius:14px}
.live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;display:inline-block;animation:pulse 2s infinite;margin-right:.35rem}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(74,222,128,.4)}50%{box-shadow:0 0 0 5px rgba(74,222,128,0)}}
.refresh-info{font-size:.72rem;color:var(--white-dim);text-align:right;margin-bottom:.75rem}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginView">
  <div class="card">
    <div class="card-title">🏗️ Manager Dashboard</div>
    <div class="card-sub">Site Manager Portal · AttendTrack</div>
    <div class="demo-chips">
      <span class="chip" onclick="fillDemo('MGR001','mgr123')">MGR001 — Site 1</span>
      <span class="chip" onclick="fillDemo('MGR002','mgr456')">MGR002 — Site 2</span>
    </div>
    <label>Manager Employee ID</label>
    <input id="empId" placeholder="e.g. MGR001" autocomplete="off">
    <label>Password</label>
    <input id="pwd" type="password" placeholder="••••••••">
    <button class="btn btn-primary" onclick="doLogin()">Login →</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- APP -->
<nav id="nav" style="display:none">
  <div class="logo">Attend<em style="font-style:italic">Track</em> · Manager</div>
  <div class="nav-right">
    <span class="nav-badge">Manager</span>
    <span class="nav-name" id="navName"></span>
    <button class="btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<div id="app">
  <div class="main">
    <div class="page-title">Site <em>Overview</em></div>
    <div class="page-sub" id="pageSub">Loading…</div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val green" id="statToday">–</div><div class="stat-lbl">Today's Check-ins</div></div>
      <div class="stat-card"><div class="stat-val amber" id="statPending">–</div><div class="stat-lbl">Pending Approval</div></div>
      <div class="stat-card"><div class="stat-val blue" id="statApproved">–</div><div class="stat-lbl">Approved Today</div></div>
      <div class="stat-card"><div class="stat-val" id="statTotal" style="color:var(--purple-light)">–</div><div class="stat-lbl">Total Labours</div></div>
    </div>

    <div class="refresh-info"><span class="live-dot"></span>Auto-refreshes every 30s · Last updated: <span id="lastUpdate">–</span></div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('pending')">⏳ Pending Approval <span class="tab-badge" id="pendingBadge">0</span></div>
      <div class="tab" onclick="switchTab('live')">🟢 Live Today</div>
      <div class="tab" onclick="switchTab('history')">📋 History</div>
    </div>

    <!-- Filter for history -->
    <div id="histFilter" style="display:none;margin-bottom:.75rem">
      <input type="date" id="filterDate" style="max-width:200px" onchange="loadAll()">
    </div>

    <div id="recList"></div>
  </div>
</div>

<script>
const API = (window.ATTENDTRACK_API || 'http://localhost:8000').replace(/\/$/, '');
let currentUser = null;
let currentTab = 'pending';
let refreshTimer = null;

function fillDemo(id, pw) {
  document.getElementById('empId').value = id;
  document.getElementById('pwd').value = pw;
}

async function doLogin() {
  const id = document.getElementById('empId').value.trim().toUpperCase();
  const pw = document.getElementById('pwd').value;
  if (!id || !pw) return;
  try {
    const r = await fetch(`${API}/api/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({employee_id: id, password: pw})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    if (d.user.role !== 'manager') throw new Error('This portal is for Site Managers only.');
    currentUser = d.user;
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('nav').style.display = 'flex';
    document.getElementById('app').style.display = 'block';
    document.getElementById('navName').textContent = currentUser.name;
    loadAll(); startRefresh();
  } catch(e) {
    const m = document.getElementById('loginMsg');
    m.className = 'msg err'; m.textContent = e.message;
  }
}

function startRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(() => { loadStats(); loadTab(); }, 30000);
}

async function loadAll() { await loadStats(); await loadTab(); }

async function loadStats() {
  try {
    const r = await fetch(`${API}/api/manager/stats/${currentUser.employee_id}`);
    const d = await r.json();
    document.getElementById('statToday').textContent = d.today_unique_checkins;
    document.getElementById('statPending').textContent = d.pending_count;
    document.getElementById('statApproved').textContent = d.approved_count;
    document.getElementById('statTotal').textContent = d.total_labours_site;
    document.getElementById('pendingBadge').textContent = d.pending_count;
    document.getElementById('pageSub').textContent = `${currentUser.site_name || 'Your Site'} · ${currentUser.name}`;
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
  } catch(e) { console.error(e); }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['pending','live','history'][i] === tab);
  });
  document.getElementById('histFilter').style.display = tab === 'history' ? 'block' : 'none';
  loadTab();
}

async function loadTab() {
  if (currentTab === 'pending') await loadPending();
  else if (currentTab === 'live') await loadLive();
  else await loadHistory();
}

async function loadPending() {
  try {
    const r = await fetch(`${API}/api/manager/pending/${currentUser.employee_id}`);
    const d = await r.json();
    renderPending(d.records);
  } catch(e) { document.getElementById('recList').innerHTML = '<div class="empty">Error loading records</div>'; }
}

function renderPending(recs) {
  const el = document.getElementById('recList');
  if (!recs.length) { el.innerHTML = '<div class="empty">No pending approvals 🎉</div>'; return; }
  el.innerHTML = recs.map(r => `
    <div class="rec-card" id="rc${r.id}">
      <div class="rec-head">
        <div>
          <div class="rec-name">${r.labour_name}</div>
          <div class="rec-meta">${r.employee_id} · ${r.phone||'–'} · ${r.site_name}</div>
        </div>
        <span class="badge b-pending">Pending</span>
      </div>
      <div class="rec-times">📅 ${r.date} · In: ${r.login_time?.slice(11,16)||'–'} → Out: ${r.logout_time?.slice(11,16)||'–'} · <strong>${r.hours_worked||0}h</strong></div>
      <div class="rec-actions">
        <input placeholder="Note (optional)" id="note${r.id}">
        <button class="btn-approve" onclick="verify(${r.id},true)">✓ Approve</button>
        <button class="btn-reject"  onclick="verify(${r.id},false)">✗ Reject</button>
      </div>
    </div>`).join('');
}

async function verify(id, approved) {
  const note = document.getElementById(`note${id}`)?.value || '';
  try {
    const r = await fetch(`${API}/api/manager/verify`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({attendance_id: id, manager_id: currentUser.employee_id, approved, note})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail);
    const card = document.getElementById(`rc${id}`);
    if (card) card.style.opacity = '0.4';
    setTimeout(() => loadAll(), 600);
  } catch(e) { alert(e.message); }
}

async function loadLive() {
  try {
    const r = await fetch(`${API}/api/manager/all/${currentUser.employee_id}`);
    const d = await r.json();
    const today = new Date().toISOString().slice(0,10);
    const recs = d.records.filter(r => r.date === today);
    renderReadOnly(recs, 'live');
  } catch(e) { document.getElementById('recList').innerHTML = '<div class="empty">Error loading</div>'; }
}

async function loadHistory() {
  const date = document.getElementById('filterDate')?.value || '';
  const url = date ? `${API}/api/manager/all/${currentUser.employee_id}?date=${date}` : `${API}/api/manager/all/${currentUser.employee_id}`;
  try {
    const r = await fetch(url);
    const d = await r.json();
    renderReadOnly(d.records, 'history');
  } catch(e) { document.getElementById('recList').innerHTML = '<div class="empty">Error loading</div>'; }
}

function renderReadOnly(recs, mode) {
  const el = document.getElementById('recList');
  if (!recs.length) { el.innerHTML = '<div class="empty">No records found</div>'; return; }
  el.innerHTML = recs.map(r => {
    const bClass = {active:'b-active',pending_manager:'b-pending',pending_hr:'b-pending',approved:'b-approved',rejected:'b-rejected'}[r.status]||'b-pending';
    return `<div class="rec-card">
      <div class="rec-head">
        <div>
          <div class="rec-name">${r.labour_name}</div>
          <div class="rec-meta">${r.employee_id} · ${r.site_name}</div>
        </div>
        <span class="badge ${bClass}">${r.status.replace('_',' ')}</span>
      </div>
      <div class="rec-times">📅 ${r.date} · In: ${r.login_time?.slice(11,16)||'–'} → Out: ${r.logout_time?.slice(11,16)||'–'} · <strong>${r.hours_worked||0}h</strong></div>
    </div>`;
  }).join('');
}

function logout() {
  clearInterval(refreshTimer);
  currentUser = null;
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('nav').style.display = 'none';
  document.getElementById('app').style.display = 'none';
}
</script>
</body>
</html>
