services:
  - type: web
    name: attendtrack-api
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendtrack-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false   # you'll set this in the Render dashboard

databases:
  - name: attendtrack-db
    plan: free   # upgrade to 'starter' or higher before going to production with 2000 employees
