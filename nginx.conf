worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── Rate limiting zones ────────────────────────────────────────────────
    # Zone for general API requests (per IP)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    # Tighter zone for auth endpoints (per IP)
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;
    # Zone for WebSocket upgrade requests
    limit_req_zone $binary_remote_addr zone=ws_connect:10m  rate=10r/s;

    limit_req_status 429;

    # ── Connection limiting ────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── Upstream — multiple uvicorn workers ───────────────────────────────
    # When running via docker-compose, scale with:
    #   docker-compose up --scale app=4
    # Nginx will round-robin across all replicas on port 8000.
    upstream attendtrack_backend {
        least_conn;                        # route to least-loaded worker
        server app:8000;                   # docker-compose service name
        keepalive 32;                      # reuse upstream connections
    }

    # ── Logging ───────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 10m;           # allow face image uploads

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    server {
        listen 80;
        server_name _;

        # ── Forward real client IP to app ─────────────────────────────────
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";   # enable upstream keepalive

        # ── Auth endpoints — strict rate limit ────────────────────────────
        location ~ ^/api/(login|face/) {
            limit_req zone=api_auth burst=10 nodelay;
            limit_conn addr 10;

            proxy_pass         http://attendtrack_backend;
            proxy_read_timeout 30s;
        }

        # ── WebSocket upgrade ─────────────────────────────────────────────
        location /ws/ {
            limit_req zone=ws_connect burst=5 nodelay;

            proxy_pass              http://attendtrack_backend;
            proxy_http_version      1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout      3600s;   # keep WS alive for 1 hour
            proxy_send_timeout      3600s;
        }

        # ── All other API routes ───────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_conn addr 20;

            proxy_pass         http://attendtrack_backend;
            proxy_read_timeout 60s;
        }

        # ── Static frontend files ─────────────────────────────────────────
        location /frontend/ {
            proxy_pass         http://attendtrack_backend;
            proxy_cache_valid  200 1d;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # ── Health check — no rate limit ──────────────────────────────────
        location /health {
            proxy_pass http://attendtrack_backend;
        }

        # ── Root portals ──────────────────────────────────────────────────
        location / {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://attendtrack_backend;
        }
    }
}
