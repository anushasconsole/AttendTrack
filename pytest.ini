[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Don't require a real DATABASE_URL for unit tests
env =
    DATABASE_URL=postgresql://fake:fake@localhost/fake
    JWT_SECRET_KEY=test-secret-key-for-testing-only-32chars
    REDIS_URL=
    AI_API_KEY=
